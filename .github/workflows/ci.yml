name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  shell:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: bash .github/scripts/check.sh
  runtime:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: python3 tests/runtime.py
      - run: git diff --exit-code HEAD
  required:
    name: ci / required
    if: always()
    needs: [shell, runtime]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: edbfi/automation/actions/gate@v4.1.0
        with:
          needs: ${{ toJSON(needs) }}
          required: shell runtime
